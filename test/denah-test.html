<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Uji mandiri denah</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#202124;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:20px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.toolbar button{min-height:40px;padding:0 14px}.hasil{padding:10px 12px;background:#fff;border:1px solid #c4c7cc;border-radius:4px;margin-bottom:16px}.hasil.ok{color:#137333}.hasil.fail{color:#9b1c1c}.halaman{background:#fff;padding:10mm;margin:0 auto 20px;max-width:1120px;box-shadow:0 2px 8px #0002}.halaman h2{font-size:18px;margin:0 0 4px}.halaman p{margin:0 0 10px;color:#5f6368}.denah{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:4mm 3mm}.denah td{padding:0;vertical-align:top}.meja{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));width:100%}.kursi{box-sizing:border-box;min-width:0;height:36px;border:1px solid #333;padding:4px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;line-height:1.15;background:#fff}.kursi+.kursi{border-left:0}.kursi b{font-size:12px;color:#1a56c4}.kursi i{font-style:normal;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.kursi.kosong{border:1px dashed #bbb;color:#999}.label{font-size:13px;font-weight:700;margin-top:12px}
    @page{size:355.6mm 215.9mm;margin:10mm}@media print{body{background:#fff;padding:0}.toolbar,.hasil{display:none}.halaman{box-shadow:none;margin:0;max-width:none;height:195.9mm;page-break-after:always}.kursi{height:15mm}}
  </style>
</head>
<body>
  <div class="toolbar"><label>Pola <select id="pola"><option value="1">1, Samping + ular</option><option value="2">2, Samping berurutan</option><option value="3">3, Belakang + ular</option><option value="4">4, Belakang berurutan</option></select></label><button id="render" type="button">Render ulang</button></div>
  <div id="hasil" class="hasil">Menunggu pengujian.</div>
  <div id="app"></div>
  <script>
    const cfg={rows:5,tables:4,seats:2};let pattern=1;const app=document.getElementById('app');
    const seatPosition=(n,rows,columns,mode,from)=>{const i=n-1;if(i<0||i>=rows*columns)return null;let row,col;if(mode<=2){row=Math.floor(i/columns);col=i%columns;if(mode===1&&row%2)col=columns-1-col}else{col=Math.floor(i/rows);row=i%rows;if(mode===3&&col%2)row=rows-1-row}if(from==='kanan-depan')col=columns-1-col;return{row,col}};
    const students=(count,level,prefix)=>Array.from({length:count},(_,index)=>({id:prefix+index+1,level,order:index+1,participant:level+prefix+String(index+1).padStart(3,'0'),name:'Siswa '+(index+1)}));
    const combined={number:'001',combined:true,shared:true,leftLevel:'7',rightLevel:'9',leftCount:21,rightCount:19,students:[...students(21,'7','L'),...students(19,'9','R').map(student=>({...student,side:'kanan',order:21+student.order})).map(student=>student)]};combined.students.slice(0,21).forEach(student=>student.side='kiri');
    const single={number:'002',combined:false,students:students(38,'8','S').map(student=>({...student,side:'kiri'}))};
    function matrix(list,rows,columns,numberFor){const out=Array.from({length:rows},()=>Array(columns).fill(null));const layoutRows=Math.max(1,Math.ceil(list.length/columns));const slots=[];for(let n=1;n<=layoutRows*columns;n++){const pos=seatPosition(n,layoutRows,columns,pattern,'kiri-depan');if(pos)slots.push({pos,n})}slots.sort((a,b)=>a.pos.row-b.pos.row||a.n-b.n);const used=slots.slice(0,list.length);const compactNo=new Map(used.slice().sort((a,b)=>a.n-b.n).map((slot,index)=>[slot,index+1]));list.slice().sort((a,b)=>numberFor(a)-numberFor(b)).forEach((student,index)=>{const slot=used[index];if(slot)out[slot.pos.row][slot.pos.col]={student,no:compactNo.get(slot)}});return out}
    function seat(seatData){const box=document.createElement('div');box.className='kursi';if(!seatData){box.classList.add('kosong');box.textContent='-';return box}box.dataset.id=seatData.student.id;const no=document.createElement('b');no.textContent=seatData.no;const participant=document.createElement('i');participant.textContent=seatData.student.participant;box.append(no,participant);return box}
    function tableFor(rows){const table=document.createElement('table');table.className='denah';const body=document.createElement('tbody');rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(seats=>{const td=document.createElement('td');const meja=document.createElement('div');meja.className='meja';meja.style.setProperty('--k',seats.length);seats.forEach(item=>meja.append(seat(item)));td.append(meja);tr.append(td)});body.append(tr)});table.append(body);return table}
    function renderCombined(room){const left=room.students.filter(s=>s.side==='kiri').sort((a,b)=>a.order-b.order);const right=room.students.filter(s=>s.side==='kanan').sort((a,b)=>a.order-b.order);const rows=Math.max(cfg.rows,Math.ceil(Math.max(left.length,right.length)/cfg.tables));const A=matrix(left,rows,cfg.tables,s=>s.order);const B=matrix(right,rows,cfg.tables,s=>s.order-room.leftCount);return A.map((row,i)=>row.map((item,j)=>[item,B[i][j]]))}
    function renderSingle(room){const rows=Math.max(cfg.rows,Math.ceil(room.students.length/(cfg.tables*cfg.seats)));const A=matrix(room.students,rows,cfg.tables*cfg.seats,s=>s.order);return A.map(row=>Array.from({length:cfg.tables},(_,i)=>row.slice(i*cfg.seats,i*cfg.seats+cfg.seats)))}
    function renderRoom(room){const section=document.createElement('section');section.className='halaman';const heading=document.createElement('h2');heading.textContent='Ruang '+room.number+' · Pola '+pattern;const note=document.createElement('p');note.textContent=room.combined?'Ruang gabungan, 21 siswa tingkat 7 dan 19 siswa tingkat 9':'Ruang tunggal, 38 siswa tingkat 8';section.append(heading,note,tableFor(room.combined?renderCombined(room):renderSingle(room)));return section}
    function patternCheck(mode){const values=(filter,axis)=>Array.from({length:20},(_,n)=>{const pos=seatPosition(n+1,5,4,mode,'kiri-depan');return pos&&filter(pos)?[pos[axis],n+1]:null}).filter(Boolean).sort((a,b)=>a[0]-b[0]).map(item=>item[1]);return mode===1?JSON.stringify(values(p=>p.row===0,'col'))==='[1,2,3,4]'&&JSON.stringify(values(p=>p.row===1,'col'))==='[8,7,6,5]':mode===2?JSON.stringify(values(p=>p.row===1,'col'))==='[5,6,7,8]':mode===3?JSON.stringify(values(p=>p.col===0,'row'))==='[1,2,3,4,5]'&&JSON.stringify(values(p=>p.col===1,'row'))==='[10,9,8,7,6]':JSON.stringify(values(p=>p.col===1,'row'))==='[6,7,8,9,10]'}
    function runTests(){const all=Array.from(document.querySelectorAll('.kursi[data-id]'));const ids=all.map(item=>item.dataset.id);const unique=new Set(ids);const rows=Array.from(document.querySelectorAll('.halaman:first-child tr'));const tables=rows[0]?rows[0].cells.length:0;const badWidth=Array.from(document.querySelectorAll('.kursi')).some(item=>item.getBoundingClientRect().width>item.closest('td').getBoundingClientRect().width+0.5);const namesHidden=!Array.from(document.querySelectorAll('.kursi')).some(item=>item.textContent.includes('Siswa'));const checks=[ids.length===78&&unique.size===78,rows.length===6,tables===4,document.querySelectorAll('.halaman:first-child .meja .kursi').length===48,document.querySelectorAll('.halaman:last-child tr').length===5,!badWidth,namesHidden,[1,2,3,4].every(patternCheck)];const ok=checks.every(Boolean);const hasil=document.getElementById('hasil');hasil.className='hasil '+(ok?'ok':'fail');hasil.textContent=(ok?'LULUS':'GAGAL')+' · '+(checks.filter(Boolean).length)+'/'+checks.length+' pemeriksaan · siswa unik '+unique.size+' dari '+ids.length+'.';}
    function render(){pattern=Number(document.getElementById('pola').value);app.replaceChildren(renderRoom(combined),renderRoom(single));runTests()}
    document.getElementById('render').onclick=render;document.getElementById('pola').onchange=render;render();
  </script>
</body>
</html>
