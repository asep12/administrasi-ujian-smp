<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Uji mandiri kartu peserta</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#000}*{box-sizing:border-box}body{margin:0;background:#eef0f3;padding:20px}.hasil{padding:10px 12px;background:#fff;border:1px solid #c4c7cc;margin-bottom:16px;color:#137333}.lembar{box-sizing:border-box;width:215.9mm;height:355.6mm;padding:10mm;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6mm;margin:0 auto 20px;box-shadow:0 2px 8px #0003}.kartu{box-sizing:border-box;border:.5mm solid #333;border-radius:1.5mm;padding:5mm 5mm 4mm;display:flex;flex-direction:column;overflow:hidden;background:#fff}.kop{display:flex;align-items:center;justify-content:center;gap:3mm;padding-bottom:2.5mm;border-bottom:.3mm solid #333;margin-bottom:3.5mm;text-align:center}.kop img{width:14mm;height:14mm;object-fit:contain;flex:none}.kop .teks{flex:1;line-height:1.2}.judul{font-size:12pt;font-weight:700}.ujian{font-size:8.5pt;font-weight:700;text-transform:uppercase}.tp{font-size:8.5pt}.sekolah{font-size:9pt;font-weight:700}.isian{display:grid;row-gap:1.8mm;font-size:10pt}.baris{display:grid;grid-template-columns:24mm 3mm minmax(0,1fr);align-items:baseline}.nilai{min-width:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}.ttd{margin-top:auto;display:flex;justify-content:space-between;gap:4mm;font-size:8.5pt;line-height:1.3;text-align:center}.kol{width:48%}.ruang-ttd{height:13mm}.nama{font-weight:700}.kosong{border:0!important}@page{size:215.9mm 355.6mm;margin:0}@media print{body{padding:0;background:#fff}.hasil{display:none}.lembar{margin:0;box-shadow:none;width:100%;height:100vh;padding:8mm;gap:4mm;page-break-after:always;break-after:page}.lembar:last-child{page-break-after:auto;break-after:auto}}
  </style>
</head>
<body>
  <div id="hasil" class="hasil">Memeriksa...</div><div id="app"></div>
  <script>
    const siswa=Array.from({length:12},(_,i)=>({induk:i===0?'001234':String(1000+i),nama:i===1?'Siswa Dengan Nama Sangat Panjang Untuk Uji Potong Dua Baris':'Siswa '+(i+1),nopes:'727'+String(i+1).padStart(3,'0'),kelas:'7A',ruang:'001'}));
    function kartu(s){const card=document.createElement('article');card.className='kartu';card.innerHTML='<div class="kop"><img src="../logo smp.png" alt="Logo"><div class="teks"><div class="judul">KARTU TANDA PESERTA</div><div class="ujian">ASESMEN SUMATIF AKHIR SEMESTER</div><div class="tp">Tahun Pelajaran 2026/2027</div><div class="sekolah">SMP NEGERI 3 KOTA SERANG</div></div></div><div class="isian"><div class="baris"><div>No. Induk</div><div>:</div><div class="nilai">'+s.induk+'</div></div><div class="baris"><div>Nama</div><div>:</div><div class="nilai">'+s.nama+'</div></div><div class="baris"><div>No. Peserta</div><div>:</div><div class="nilai">'+s.nopes+'</div></div><div class="baris"><div>Kelas</div><div>:</div><div class="nilai">'+s.kelas+'</div></div><div class="baris"><div>Ruang</div><div>:</div><div class="nilai">'+s.ruang+'</div></div></div><div class="ttd"><div class="kol">Mengetahui,<br>Kepala Sekolah<div class="ruang-ttd"></div><div class="nama">Kepala Sekolah</div>NIP. 000000000000000000</div><div class="kol">Serang, 7 November 2026<br>Panitia<div class="ruang-ttd"></div>( . . . . . . . . )</div></div>';return card}
    const app=document.getElementById('app');for(let i=0;i<siswa.length;i+=6){const page=document.createElement('section');page.className='lembar';siswa.slice(i,i+6).forEach(s=>page.append(kartu(s)));app.append(page)}
    const cards=[...document.querySelectorAll('.kartu')];const pages=[...document.querySelectorAll('.lembar')];const dots=[...document.querySelectorAll('.nilai')].some(x=>getComputedStyle(x).borderBottomStyle==='dotted');const ratio=cards[0].getBoundingClientRect().height/cards[0].getBoundingClientRect().width;const ok=cards.length===12&&pages.length===2&&pages.every(p=>p.children.length===6)&&ratio>1.05&&ratio<1.2&&!dots;document.getElementById('hasil').textContent=(ok?'LULUS':'GAGAL')+' · '+cards.length+' kartu · '+pages.length+' halaman · rasio '+ratio.toFixed(2)+' · tanpa garis titik.';
  </script>
</body>
</html>
