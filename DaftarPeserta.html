<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><style>
:root{font-family:Inter,Arial,sans-serif;color:#202124;font-size:14px;--blue:#1a56c4}*{box-sizing:border-box}body{margin:0}.top{height:58px;background:#f8f9fb;border-bottom:1px solid #e0e3e7;padding:19px 24px;font-size:16px;font-weight:600}main{padding:18px 24px}h1{font-size:21px;margin:0 0 6px}p{color:#5f6368;margin:0 0 14px;line-height:1.5}.tools{display:flex;gap:14px;align-items:end;flex-wrap:wrap;border:1px solid #e0e3e7;border-radius:8px;padding:12px 14px}.field{display:grid;gap:5px;font-weight:600}.field select{height:38px;padding:0 9px;border:1px solid #c4c7cc;border-radius:6px;background:#fff;font:inherit}.preview{margin-top:14px;background:#e8eaed;border-radius:8px;padding:14px;max-height:540px;overflow:auto}.page{background:#fff;padding:10mm;margin:0 auto 14px;box-shadow:0 1px 5px #aaa;width:215.9mm;font-family:Arial,sans-serif}.head{display:flex;align-items:center;gap:5mm;border-bottom:1px solid #111;padding-bottom:4mm}.logo{width:16mm;height:16mm;object-fit:contain}.head h2{font-size:15pt;margin:0 0 1mm}.school{font-size:10pt;font-weight:bold}.year{font-size:9pt}.head .room{margin-left:auto;border:1px solid #111;padding:4mm;font-weight:bold;font-size:18pt}.table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10pt;margin-top:5mm}.table th,.table td{border:1px solid #555;padding:1.5mm;text-align:center;vertical-align:middle}.table th{background:#eef3fd}.table th.name,.table td.name{text-align:left}.table th.no,.table td.no{width:8%}.table th.participant,.table td.participant{width:24%}.table th.room,.table td.room{width:14%}.message{min-height:20px;margin-top:10px}.message.error{color:#9b1c1c}.message.ok{color:#137333}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.actions button{min-height:42px;padding:0 16px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}.actions .secondary{border:1px solid #c4c7cc;background:#fff;color:#202124}.actions button:disabled{opacity:.5;cursor:not-allowed}@page{size:215.9mm 355.6mm;margin:0}@media print{body{background:#fff}.top,main>h1,main>p,.tools,.actions,.message{display:none!important}.preview{margin:0;padding:0;max-height:none;overflow:visible;background:#fff}.page{box-shadow:none;margin:0;width:auto;padding:8mm;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto;break-after:auto}thead{display:table-header-group}tr{page-break-inside:avoid;break-inside:avoid}}
</style></head><body><header class="top">Administrasi Ujian · Daftar Peserta</header><main><h1>Daftar peserta per ruangan</h1><p>Tabel peserta diambil dari pembagian ruang. Satu halaman per ruang, dicetak pada kertas F4 potret.</p><section class="tools"><label class="field">Ruang<select id="scope" onchange="render()"><option value="all">Semua ruang</option></select></label></section><div id="message" class="message">Memuat data...</div><div id="preview" class="preview"></div><div class="actions"><button class="secondary" onclick="render()">Perbarui</button><button onclick="window.print()">Cetak / Simpan PDF</button></div></main><script>
let data=null;const $=id=>document.getElementById(id);
function load(){google.script.run.withSuccessHandler(result=>{data=result;if(!result.valid){show(result.message,true);return}const select=$('scope');[...new Set(result.sections.map(x=>x.room))].forEach(room=>{const o=document.createElement('option');o.value=room;o.textContent='Ruang '+String(room).padStart(3,'0');select.append(o)});render()}).withFailureHandler(error=>show(error.message||String(error),true)).getDataDaftarPeserta()}
function show(text,error){$('message').textContent=text;$('message').className='message'+(error?' error':' ok')}
function render(){if(!data)return;const groups=[];data.sections.forEach(section=>{let group=groups.find(x=>x.room===section.room);if(!group){group={room:section.room,students:[]};groups.push(group)}section.students.forEach(student=>group.students.push(student))});groups.forEach(group=>group.students.sort((a,b)=>String(a.participant).localeCompare(String(b.participant),'id',{numeric:true})||String(a.name).localeCompare(String(b.name),'id')));const visible=groups.filter(x=>$('scope').value==='all'||String(x.room)===$('scope').value);const preview=$('preview');preview.replaceChildren();visible.forEach(group=>preview.append(buildPage(group)));show(visible.length?visible.length+' daftar peserta siap dicetak.':'Tidak ada data peserta untuk pilihan ini.',!visible.length)}
function buildPage(group){const page=document.createElement('section');page.className='page';const head=document.createElement('div');head.className='head';if(data.config.logoDataUri){const img=document.createElement('img');img.className='logo';img.src=data.config.logoDataUri;img.alt='Logo sekolah';head.append(img)}const title=document.createElement('div');const h=document.createElement('h2');h.textContent='DAFTAR PESERTA '+data.config.exam.toUpperCase();const school=document.createElement('div');school.className='school';school.textContent=data.config.school;const year=document.createElement('div');year.className='year';year.textContent='Tahun Pelajaran '+data.config.year;title.append(h,school,year);head.append(title);const room=document.createElement('div');room.className='room';room.textContent='RUANG '+String(group.room).padStart(3,'0');head.append(room);page.append(head);const table=document.createElement('table');table.className='table';const thead=document.createElement('thead');const headRow=document.createElement('tr');[['No','no'],['Nomor Peserta','participant'],['Nama Peserta','name'],['Ruangan','room']].forEach(([text,name])=>{const th=document.createElement('th');th.textContent=text;th.className=name;headRow.append(th)});thead.append(headRow);table.append(thead);const tbody=document.createElement('tbody');group.students.forEach((student,index)=>{const tr=document.createElement('tr');[index+1,student.participant,student.name,String(group.room).padStart(3,'0')].forEach((value,i)=>{const td=document.createElement('td');td.textContent=value||'';td.className=['no','participant','name','room'][i];tr.append(td)});tbody.append(tr)});table.append(tbody);page.append(table);return page}
load();
</script></body></html>
