<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><style>
:root{font-family:Inter,Arial,sans-serif;color:#202124;font-size:14px;--blue:#1a56c4}*{box-sizing:border-box}body{margin:0}.top{height:58px;background:#f8f9fb;border-bottom:1px solid #e0e3e7;padding:19px 24px;font-size:16px;font-weight:600}main{padding:18px 24px}h1{font-size:21px;margin:0 0 6px}p{color:#5f6368;margin:0 0 14px;line-height:1.5}.tools{display:flex;gap:14px;align-items:end;flex-wrap:wrap;border:1px solid #e0e3e7;border-radius:8px;padding:12px 14px}.field{display:grid;gap:5px;font-weight:600}.field select{height:38px;padding:0 9px;border:1px solid #c4c7cc;border-radius:6px;background:#fff;font:inherit}.preview{margin-top:14px;background:#e8eaed;border-radius:8px;padding:14px;max-height:540px;overflow:auto}.page{background:#fff;padding:10mm;margin:0 auto 14px;box-shadow:0 1px 5px #aaa;min-width:260mm;font-family:Arial,sans-serif}.head{display:flex;align-items:center;gap:5mm;border-bottom:1px solid #111;padding-bottom:4mm}.logo{width:16mm;height:16mm;object-fit:contain}.head h2{font-size:15pt;margin:0 0 1mm}.school{font-size:10pt;font-weight:bold}.year{font-size:9pt}.room{margin-left:auto;border:1px solid #111;padding:4mm;font-weight:bold;font-size:18pt}.meta{display:flex;justify-content:space-between;font-size:9pt;margin:3mm 0}.table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.5pt}.table th,.table td{border:1px solid #555;padding:1.2mm;text-align:center;overflow-wrap:anywhere;word-break:break-word;line-height:1.15;vertical-align:middle}.table th{background:#eef3fd}.table th.name{text-align:center;width:16%}.table td.name{text-align:left;width:16%}.table th.class,.table td.class{width:5%}.table th.no,.table td.no{width:3%}.table th.participant,.table td.participant{width:8%}.table th.note,.table td.note{width:5%}.table td{height:11mm}.date-head{font-size:7pt;line-height:1.1;overflow-wrap:normal;word-break:normal}.subject-head{font-size:6pt;line-height:1.05;white-space:normal;overflow-wrap:normal;word-break:normal;padding:.6mm}.time{font-size:6pt;font-weight:normal}.summary{display:flex;justify-content:space-between;margin-top:5mm;font-size:8pt}.signatures{display:flex;justify-content:space-between;margin-top:8mm;font-size:8pt;text-align:center}.sign{width:42mm}.space{height:18mm}.signature-image{display:block;width:38mm;height:18mm;object-fit:contain;margin:0 auto}.name{font-weight:bold}.message{min-height:20px;margin-top:10px}.error{color:#9b1c1c}.ok{color:#137333}button{min-height:42px;padding:0 16px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}.secondary{border:1px solid #c4c7cc;background:#fff;color:#202124}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}@page{size:355.6mm 215.9mm;margin:6mm}@page portrait{size:215.9mm 355.6mm;margin:8mm}body[data-orientation="portrait"]{page:portrait}@media print{.top,main>h1,main>p,.tools,.actions,.message{display:none!important}.preview{padding:0;max-height:none;overflow:visible;background:#fff}.page{box-shadow:none;margin:0;min-width:0;height:auto;padding:0;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto;break-after:auto}thead{display:table-header-group}tr{page-break-inside:avoid;break-inside:avoid}}
</style></head><body><header class="top">Administrasi Ujian · Daftar Hadir</header><main><h1>Daftar hadir per mata pelajaran</h1><p>Kolom tanda tangan dibentuk otomatis dari sheet <b>JADWAL</b>. Ruang gabungan dipisah per tingkat.</p><section class="tools"><label class="field">Ruang<select id="scope" onchange="render()"><option value="all">Semua ruang</option></select></label><label class="field">Orientasi<select id="orientation" onchange="render()"><option value="landscape">Lanskap</option><option value="portrait">Potret</option></select></label></section><div id="message" class="message">Memuat data...</div><div id="preview" class="preview"></div><div class="actions"><button class="secondary" onclick="render()">Perbarui</button><button onclick="window.print()">Cetak / Simpan PDF</button></div></main><script>
let data=null;const $=id=>document.getElementById(id);function load(){google.script.run.withSuccessHandler(result=>{data=result;if(!result.valid){show(result.message,true);return}const select=$('scope');[...new Set(result.sections.map(x=>x.room))].forEach(room=>{const o=document.createElement('option');o.value=room;o.textContent='Ruang '+String(room).padStart(3,'0');select.append(o)});$('orientation').value=result.config.attendanceOrientation||'landscape';render()}).withFailureHandler(error=>show(error.message||String(error),true)).getDataDaftarHadir()}
function show(text,error){$('message').textContent=text;$('message').className='message'+(error?' error':' ok')}
function render(){if(!data)return;const sections=data.sections.filter(x=>$('scope').value==='all'||String(x.room)===$('scope').value);const preview=$('preview');preview.replaceChildren();sections.forEach(section=>preview.append(buildPage(section)));show(sections.length?sections.length+' daftar hadir siap dicetak.':'Tidak ada data daftar hadir untuk pilihan ini.',!sections.length);document.body.dataset.orientation=$('orientation').value}
function buildPage(section){const page=document.createElement('section');page.className='page';const head=document.createElement('div');head.className='head';if(data.config.logoDataUri){const img=document.createElement('img');img.className='logo';img.src=data.config.logoDataUri;img.alt='Logo sekolah';head.append(img)}const title=document.createElement('div');const h=document.createElement('h2');h.textContent='DAFTAR HADIR '+data.config.exam.toUpperCase();const school=document.createElement('div');school.className='school';school.textContent=data.config.school;const year=document.createElement('div');year.className='year';year.textContent='Tahun Pelajaran '+data.config.year;title.append(h,school,year);head.append(title);const room=document.createElement('div');room.className='room';room.textContent='RUANG '+String(section.room).padStart(3,'0');head.append(room);page.append(head);const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span>Tingkat: <b>'+section.level+'</b></span><span>Peserta: <b>'+section.students.length+'</b></span>';page.append(meta);page.append(buildTable(section));const summary=document.createElement('div');summary.className='summary';summary.innerHTML='<span>Hadir: ________</span><span>Tidak hadir: ________</span><span>Keterangan: ____________________</span>';page.append(summary);const signs=document.createElement('div');signs.className='signatures';signs.innerHTML='<div class="sign">Pengawas 1<div class="space"></div>( __________________ )</div><div class="sign">Pengawas 2<div class="space"></div>( __________________ )</div><div class="sign">'+escapeHtml(data.config.city)+', '+escapeHtml(data.config.printDate||'')+'<br>'+escapeHtml(data.config.headTitle||'Kepala Sekolah')+'<div class="space"></div><span class="name">'+escapeHtml(data.config.headName||'')+'</span><br>NIP. '+escapeHtml(data.config.headNip||'')+'</div>';page.append(signs);if(data.config.headSignatureDataUri){const image=document.createElement('img');image.className='signature-image';image.src=data.config.headSignatureDataUri;image.alt='Tanda tangan '+(data.config.headName||'Kepala Sekolah');signs.querySelector('.sign:last-child .space').replaceWith(image)}return page}
function buildTable(section){const table=document.createElement('table');table.className='table';const thead=document.createElement('thead');const dateRow=document.createElement('tr');['No','Nama','Nomor Peserta','Kelas'].forEach((text,i)=>{const th=document.createElement('th');th.textContent=text;th.className=['no','name','participant','class'][i];th.rowSpan=2;dateRow.append(th)});const groups=[];section.schedule.forEach(item=>{let group=groups.find(x=>x.date===item.date);if(!group){group={date:item.date,items:[]};groups.push(group)}group.items.push(item)});groups.forEach(group=>{const th=document.createElement('th');th.colSpan=group.items.length;th.className='date-head';th.textContent=group.date;dateRow.append(th)});const note=document.createElement('th');note.textContent='Ket.';note.rowSpan=2;note.className='note';dateRow.append(note);thead.append(dateRow);const subjectRow=document.createElement('tr');groups.forEach(group=>group.items.forEach(item=>{const th=document.createElement('th');th.className='subject-head';th.textContent=item.short;subjectRow.append(th)}));thead.append(subjectRow);table.append(thead);const tbody=document.createElement('tbody');section.students.forEach((student,index)=>{const tr=document.createElement('tr');[index+1,student.name,student.participant,student.className].forEach((value,i)=>{const td=document.createElement('td');td.textContent=value||'';td.className=['no','name','participant','class'][i];tr.append(td)});section.schedule.forEach(()=>{const td=document.createElement('td');td.textContent='';tr.append(td)});const td=document.createElement('td');td.textContent='';td.className='note';tr.append(td);tbody.append(tr)});table.append(tbody);return table}
function escapeHtml(value){const div=document.createElement('div');div.textContent=value;return div.innerHTML}load();
</script></body></html>
